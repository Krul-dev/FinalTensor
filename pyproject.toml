[project]
name = "FinalTensor"
version = "0.1.0"
description = ""
authors = [{ name="Raul Gomez", email="rgomez@tec.mx" }]
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "matplotlib",
  "scipy",
  "tensorflow",
  "pandas",
  "jupyter",
  "nbconvert",
  "pyyaml",
  "ipywidgets",
  "scikit-learn",
  "streamlit"
]

[project.scripts]
train_and_deploy = "FinalTensor.train_and_deploy:main"
train_model = "FinalTensor.train_model:main"



[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"
